<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Stuff</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/composants.css">
</head>
<body>
    <div class="page">
        <header id="entete" class="entete"></header>

        <main class="contenu-principal">
            <div class="conteneur">
                <h1>Connexion</h1>

                <div id="zone-message"></div>

                <form id="formulaire-connexion" class="formulaire" novalidate>
                    <div class="champ">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>

                    <div class="champ">
                        <label for="motDePasse">Mot de passe</label>
                        <input type="password" id="motDePasse" name="motDePasse" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="bouton bouton-principal bouton-pleine-largeur">Se connecter</button>
                </form>

                <p>Pas encore de compte ? <a href="inscription.html">Créez-en un</a></p>
            </div>
        </main>
    </div>

    <script type="module">
        import { afficherEntete } from "./js/header.js";
        import { initialiserFormulaireConnexion } from "./js/auth.js";

        afficherEntete();
        initialiserFormulaireConnexion();
    </script>
</body>
</html>
