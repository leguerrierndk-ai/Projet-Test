<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déposer une annonce - Stuff</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/composants.css">
</head>
<body>
    <div class="page">
        <header id="entete" class="entete"></header>

        <main class="contenu-principal">
            <div class="conteneur">
                <h1 id="titre-page">Déposer une annonce</h1>

                <div id="zone-message"></div>

                <form id="formulaire-article" class="formulaire-large" novalidate>
                    <div class="champ">
                        <label for="titre">Titre</label>
                        <input type="text" id="titre" name="titre" required>
                    </div>

                    <div class="champ">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required></textarea>
                    </div>

                    <div class="champ">
                        <label for="imageUrl">URL de l'image</label>
                        <input type="url" id="imageUrl" name="imageUrl" required placeholder="https://...">
                    </div>

                    <div class="champ">
                        <label for="prix">Prix (€)</label>
                        <input type="number" id="prix" name="prix" min="0" step="0.01" required>
                    </div>

                    <button type="submit" class="bouton bouton-principal">Publier l'annonce</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { afficherEntete } from "./js/header.js";
        import { initialiserCreation } from "./js/creation.js";

        afficherEntete();
        initialiserCreation();
    </script>
</body>
</html>
