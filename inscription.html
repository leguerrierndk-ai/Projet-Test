<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte-Stuff</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/composants.css">
</head>
<body>
    <div class="page">
        <header id="entete" class="entete"></header>

        <main class="contenu-principal">
            <div class="conteneur">
                <h1>Créer un compte</h1>

                <div id="zone-message"></div>

                <form id="formulaire-inscription" class="formulaire" novalidate>
                    <div class="champ">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>

                    <div class="champ">
                        <label for="motDePasse">Mot de passe</label>
                        <input type="password" id="motDePasse" name="motDePasse" required autocomplete="new-password" minlength="6">
                    </div>

                    <div class="champ">
                        <label for="confirmation">Confirme le mot de passe</label>
                        <input type="password" id="confirmation" name="confirmation" required autocomplete="new-password" minlength="6">
                    </div>

                    <button type="submit" class="bouton bouton-principal bouton-pleine-largeur">Créer mon compte</button>
                </form>

                <p>Déjà un compte ? <a href="connexion.html">Connecte-toi</a></p>
            </div>
        </main>
    </div>

    <script type="module">
        import { afficherEntete } from "./js/header.js";
        import { initialiserFormulaireInscription } from "./js/auth.js";

        afficherEntete();
        initialiserFormulaireInscription();
    </script>
</body>
</html>
